# Diagnostic UCLA variant with a continuous error target for uncertainty.
dataset: cifar100
data_dir: /home/users/s224574/attention/attention_v2/data
num_classes: 100
seed: 42
batch_size: 128
workers: 4
attention:
  groups_per_stage: 16
  hidden: 64
  budget: 0.50
  max_budget: 0.75
  uncertainty_weight: 0.5
  adaptive_extra: 0.30
  mode: ucla
training:
  warmup_epochs: 2
  pilot_epochs: 6
  fine_tune_epochs: 2
  brier_weight: 0.1
  budget_weight: 0.01
  uncertainty_target: soft_error
distributed:
  world_size: 4

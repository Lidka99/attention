dataset: tinyimagenet
data_dir: data/tiny-imagenet-200
num_classes: 200
seed: 42
batch_size: 64
workers: 4
attention:
  groups_per_stage: 16
  hidden: 64
  budget: 0.625
  min_groups_per_stage: 4
  allocation: value
  quota_temperature: 1.5
training:
  epochs: 20
  optimizer: muon_hybrid
  learning_rate: 0.001
  weight_decay: 0.0001
  value_weight: 0.2
  counterfactual_every: 32
  ablation_groups: 4
  evaluate_test: false
distributed:
  world_size: 4

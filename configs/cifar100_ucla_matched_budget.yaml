# UCLA comparison at the same realised keep-ratio as static and utility-only.
# Base 8/16 groups plus the expected uncertainty allowance of about 2 groups
# gives approximately 10/16 = 62.5% active groups.
dataset: cifar100
data_dir: /home/users/s224574/attention/attention_v2/data
num_classes: 100
seed: 42
batch_size: 128
workers: 4
attention:
  groups_per_stage: 16
  hidden: 64
  budget: 0.50
  max_budget: 0.75
  uncertainty_weight: 0.5
  adaptive_extra: 0.25
  mode: ucla
training:
  warmup_epochs: 2
  pilot_epochs: 6
  fine_tune_epochs: 2
  brier_weight: 0.1
  budget_weight: 0.01
distributed:
  world_size: 4
